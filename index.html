<!doctype html>
<html lang="it">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>BootStrap</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" type="text/css" href="assets/css/style.css" />
	</head>
	<body>
		<h1 class="text-center">BOOTSTRAP</h1>
		<div class="container-lg">
			<div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-3">
				<div class="col border-1 bg-warning fw-bold">
					<p class="h1">COLONNA 1</p>
				</div>
				<div class="col border-1 bg-info fw-bold">
					<p class="h1">COLONNA 2</p>
				</div>
				<div class="col border-1 bg-danger fw-bold">
					<p class="h1">COLONNA 3</p>
				</div>
				<div class="col border-1 bg-primary fw-bold">
					<p class="h1">COLONNA 4</p>
				</div>
				<div class="col border-1 bg-secondary fw-bold">
					<p class="h1">COLONNA 5</p>
				</div>
				<div class="col border-1 bg-success fw-bold">
					<p class="h1">COLONNA 6</p>
				</div>
			</div>
		</div>

		<hr />

		<div class="container-lg">
			<div class="row">
				<div class="col-6 col-md-4 border border-3">PRIMO BOX</div>
				<div class="col-6 col-md-4 border border-3">SECONDO BOX</div>
				<div class="col-6 col-md-4 border border-3">TERZO BOX</div>
				<div class="col-6 col-md-6 col-lg-4 border border-3">
					QUARTO BOX
				</div>
				<div class="col-12 col-md-6 col-lg-8 border border-3">
					QUINTO BOX
				</div>
			</div>
		</div>

		<hr />

		<div class="container-lg">
			<div class="row gx-4">
				<div class="col-12 col-lg-7 order-lg-2 border border-3">
					MAIN
				</div>
				<div class="col-12 col-lg-3 order-lg-1 border border-3">
					NEWS
				</div>
				<div class="col-12 col-lg-2 order-lg-3 border border-3">
					ASIDE
				</div>
			</div>
		</div>

		<hr />

		<div class="container">
			<div class="row">
				<div class="col-7 border border-3">
					<div class="container">
						<div class="row">
							<div class="col-6 border border-1">ANNIDATA 1</div>
							<div class="col-6 border border-1">ANNIDATA 2</div>
							<div class="col-6 border border-1">ANNIDATA 3</div>
							<div class="col-6 border border-1">ANNIDATA 4</div>
						</div>
					</div>
				</div>
				<div class="col-5 border border-3">PRINCIPALE</div>
			</div>
		</div>
	</body>
</html>
